---
name: Validate Ansible
'on':
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation tools
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml
      - name: Validate YAML
        run: yamllint .
      - name: Lint Ansible
        run: ansible-lint
      - name: Check server and WSL syntax
        run: |
          ansible-playbook -i inventory.ini playbook.yml --syntax-check
          ansible-playbook -i inventory.ini verify.yml --syntax-check
          ansible-playbook -i inventory.wsl.ini playbook.yml --syntax-check
          ansible-playbook -i inventory.wsl.ini verify.yml --syntax-check
      - name: Render and validate Compose
        run: ansible-playbook -i localhost, tests/render.yml
