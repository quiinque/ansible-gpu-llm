---
name: Validate Ansible
'on':
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation tools
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml
      - name: Validate YAML
        run: yamllint .
      - name: Lint Ansible
        run: ansible-lint
      - name: Check server and WSL syntax
        run: |
          ansible-playbook -i inventory.ini playbook.yml --syntax-check
          ansible-playbook -i inventory.ini verify.yml --syntax-check
          ansible-playbook -i inventory.wsl.ini playbook.yml --syntax-check
          ansible-playbook -i inventory.wsl.ini verify.yml --syntax-check
      - name: Render and validate Compose
        run: ansible-playbook -i localhost, tests/render.yml
