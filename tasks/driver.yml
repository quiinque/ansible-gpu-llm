---
- name: Install native driver prerequisites
  ansible.builtin.apt:
    name:
      - ubuntu-drivers-common
      - "linux-headers-{{ ansible_facts.kernel }}"
    state: present

- name: Inspect PCI devices
  ansible.builtin.command: lspci -Dn
  register: pci_devices
  changed_when: false

- name: Require an NVIDIA display or compute device
  ansible.builtin.assert:
    that:
      - pci_devices.stdout is search('(?im) (0300|0302|0380): 10de:')
    fail_msg: No NVIDIA GPU found. Check PCI passthrough or physical hardware.

- name: Probe existing driver
  ansible.builtin.command: nvidia-smi
  register: initial_smi
  changed_when: false
  failed_when: false

- name: Install explicitly selected driver
  ansible.builtin.apt:
    name: '{{ nvidia_driver_package }}'
    state: present
  when: nvidia_driver_package | length > 0
  register: explicit_driver

- name: Install Ubuntu recommended compute driver when needed
  ansible.builtin.command: ubuntu-drivers install --gpgpu
  when:
    - nvidia_driver_package | length == 0
    - initial_smi.rc != 0
  changed_when: true
  register: automatic_driver

- name: Check pending reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_marker

- name: Handle driver or pending system reboot
  when: explicit_driver is changed or automatic_driver is changed or reboot_marker.stat.exists
  block:
    - name: Require an allowed maintenance reboot
      ansible.builtin.assert:
        that: allow_reboot | bool
        fail_msg: Reboot required. Reboot manually and rerun, or set allow_reboot=true.
    - name: Reboot and wait for SSH
      ansible.builtin.reboot:
        reboot_timeout: 900
        post_reboot_delay: 20


