---
- name: Inspect installed packages for conflicting Docker installations
  ansible.builtin.package_facts:
    manager: apt

- name: Require clean Docker CE installation path
  ansible.builtin.assert:
    that:
      - "item not in ansible_facts.packages"
    fail_msg: 'Conflicting package {{ item }} found. Plan migration before running this playbook.'
  loop: [docker.io, docker-compose, docker-compose-v2, podman-docker, containerd, runc]

- name: Create APT key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download repository signing keys
  ansible.builtin.get_url:
    url: '{{ item.url }}'
    dest: '{{ item.dest }}'
    mode: '0644'
  loop:
    - url: https://download.docker.com/linux/ubuntu/gpg
      dest: /etc/apt/keyrings/docker.asc
    - url: https://nvidia.github.io/libnvidia-container/gpgkey
      dest: /etc/apt/keyrings/nvidia-container-toolkit.asc

- name: Configure signed repositories
  ansible.builtin.apt_repository:
    repo: '{{ item.repo }}'
    filename: '{{ item.filename }}'
    state: present
  loop:
    - filename: docker
      repo: >-
        deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
        https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable
    - filename: nvidia-container-toolkit
      repo: >-
        deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc]
        https://nvidia.github.io/libnvidia-container/stable/deb/amd64 /

- name: Install Docker and NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: '{{ gpu_llm_container_packages_to_install }}'
    state: present
    update_cache: true
    cache_valid_time: '{{ gpu_llm_apt_cache_valid_time }}'
  notify: Restart Docker

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  when: not ansible_check_mode

- name: Inspect Docker runtimes
  ansible.builtin.command:
    argv: [docker, info, --format, '{{ "{{json .Runtimes}}" }}']
  register: gpu_llm_docker_runtimes
  changed_when: false
  when: not ansible_check_mode

- name: Configure NVIDIA runtime without replacing other daemon settings
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  when:
    - not ansible_check_mode
    - "'nvidia' not in (gpu_llm_docker_runtimes.stdout | from_json)"
  changed_when: true
  notify: Restart Docker

- name: Apply runtime before creating GPU container
  ansible.builtin.meta: flush_handlers
