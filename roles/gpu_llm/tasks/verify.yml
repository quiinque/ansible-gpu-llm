---
- name: Generate a short completion
  ansible.builtin.uri:
    url: 'http://127.0.0.1:{{ gpu_llm_port }}/api/generate'
    method: POST
    use_proxy: false
    body_format: json
    body:
      model: '{{ gpu_llm_model }}'
      prompt: 'Reply with one short greeting.'
      stream: false
      think: false
      keep_alive: 10m
      options:
        num_ctx: '{{ gpu_llm_context_length | int }}'
        num_predict: 32
        temperature: 0
    timeout: '{{ gpu_llm_generation_timeout | int }}'
  register: gpu_llm_generation

- name: Require a completed nonempty response
  ansible.builtin.assert:
    that:
      - gpu_llm_generation.json.done | default(false) | bool
      - gpu_llm_generation.json.response | default('') | trim | length > 0
      - gpu_llm_generation.json.eval_count | default(0) | int > 0

- name: Inspect loaded model GPU allocation
  ansible.builtin.uri:
    url: 'http://127.0.0.1:{{ gpu_llm_port }}/api/ps'
    use_proxy: false
  register: gpu_llm_loaded_models

- name: Require GPU memory allocation for the requested model
  ansible.builtin.assert:
    that:
      - >-
        gpu_llm_loaded_models.json.models
        | selectattr('name', 'match', '^' ~ (gpu_llm_model | regex_escape) ~ '(:|$)')
        | map(attribute='size_vram') | map('int') | sum > 0
    fail_msg: Model did not allocate VRAM. Check driver, GPU compatibility, memory and Ollama logs.
  when: gpu_llm_require_gpu | bool
